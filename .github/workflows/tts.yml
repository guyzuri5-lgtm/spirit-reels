name: tts
# Generates Hebrew voiceover files (edge-tts, free) for tts/segments.json. Runs only on the tts-voiceover branch.
on:
  push:
    branches: [tts-voiceover]
    paths: ['tts/segments.json', 'tts/make_vo.py', '.github/workflows/tts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q edge-tts
      - run: python3 tts/make_vo.py
      - name: Commit voiceover to this branch
        run: |
          rm -rf tts/out && mv out tts/out
          git config user.name "spirit-reels bot"; git config user.email "actions@users.noreply.github.com"
          git add tts/out && git commit -qm "voiceover files [skip ci]" && git push -q origin HEAD:tts-voiceover
