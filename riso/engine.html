<!DOCTYPE html>
<html lang="he"><head><meta charset="utf-8">
<style>

@font-face{font-family:Rubik;font-weight:800;src:url(fonts/rubik-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Rubik;font-weight:900;src:url(fonts/rubik-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Rubik;font-weight:500;src:url(fonts/rubik-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}

@font-face{font-family:Rubik;font-weight:800;src:url(fonts/rubik-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:Rubik;font-weight:900;src:url(fonts/rubik-hebrew-900-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:"Space Mono";font-weight:400;src:url(fonts/space-mono-latin-400-normal.woff2) format('woff2')}

html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* riso engine — renders a spirit-reels video spec (see riso/README.md) frame by frame: window.render(t) */
const W=1080,H=1920;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const DATA=window.DATA;               // {beats:[{type,t0,t1,...}], chunks:[{w,ws,t0,t1}], keywords:[], duration, live:{}}
const C={paper:'#ebe3d1',paperHi:'#f4eddc',navy:'#33448a',navyD:'#232f6b',line:'#26306a',orange:'#f07a33',pink:'#e9568f',yellow:'#f3b234',teal:'#3ea39f',grey:'#a8a291',ink:'#20285a',bone:'#ece3cf'};
const COL=n=>C[n]||n||C.orange;

// ---------- helpers ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>mulberry(n*9973+17)();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const easeOut=u=>1-Math.pow(1-clamp(u),3);
const back=u=>{u=clamp(u);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)};
const twos=t=>Math.floor(t*15)/15;
const boilSeed=t=>Math.floor(t*10);
const strSeed=s=>{let h=7;for(const ch of String(s||''))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

// ---------- textures ----------
const TEX={};
function buildTextures(){
  const R=mulberry(7);
  const p=makeCanvas(W,H),pc=p.getContext('2d');
  pc.fillStyle=C.paper;pc.fillRect(0,0,W,H);
  let id=pc.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(R()-0.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n*0.9}
  pc.putImageData(id,0,0);
  pc.globalAlpha=0.06;pc.strokeStyle='#8a7f66';pc.lineWidth=1;
  for(let i=0;i<900;i++){const x=R()*W,y=R()*H,a=R()*6.28,l=6+R()*22;pc.beginPath();pc.moveTo(x,y);pc.quadraticCurveTo(x+Math.cos(a)*l*0.5+R()*4,y+Math.sin(a)*l*0.5+R()*4,x+Math.cos(a)*l,y+Math.sin(a)*l);pc.stroke()}
  pc.globalAlpha=1;
  const vg=pc.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);vg.addColorStop(0,'rgba(120,100,70,0)');vg.addColorStop(1,'rgba(120,100,70,0.16)');pc.fillStyle=vg;pc.fillRect(0,0,W,H);
  TEX.paper=p;
  const n=makeCanvas(W,H),nc=n.getContext('2d');
  nc.fillStyle=C.navy;nc.fillRect(0,0,W,H);
  [[18,32,0.35],[40,72,0.22],[110,196,0.12]].forEach(([gw,gh,a])=>{const s=makeCanvas(gw,gh),sc=s.getContext('2d');const sd=sc.createImageData(gw,gh);
    for(let i=0;i<sd.data.length;i+=4){const v=R();const lite=v>0.5;sd.data[i]=lite?96:22;sd.data[i+1]=lite?112:32;sd.data[i+2]=lite?170:86;sd.data[i+3]=Math.abs(v-0.5)*2*255}
    sc.putImageData(sd,0,0);nc.globalAlpha=a;nc.imageSmoothingEnabled=true;nc.imageSmoothingQuality='high';nc.drawImage(s,0,0,W,H)});
  nc.globalAlpha=1;id=nc.getImageData(0,0,W,H);d=id.data;
  for(let i=0;i<d.length;i+=4){const v=(R()-0.5)*18;d[i]+=v;d[i+1]+=v;d[i+2]+=v}
  nc.putImageData(id,0,0);TEX.navy=n;
  const w=makeCanvas(W,H),wc=w.getContext('2d');
  for(let i=0;i<26000;i++){const x=R()*W,y=R()*H,r=R()*1.6+0.3;wc.fillStyle=`rgba(240,233,216,${0.25+R()*0.5})`;wc.beginPath();wc.arc(x,y,r,0,6.28);wc.fill()}
  for(let i=0;i<70;i++){const x=R()*W,y=R()*H;wc.fillStyle='rgba(240,233,216,0.10)';wc.beginPath();wc.ellipse(x,y,20+R()*70,8+R()*30,R()*3,0,6.28);wc.fill()}
  TEX.wear=w;
  const g=makeCanvas(540,960),gc=g.getContext('2d');const gd=gc.createImageData(540,960);
  for(let i=0;i<gd.data.length;i+=4){const v=R()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255}
  gc.putImageData(gd,0,0);TEX.grain=g;
  TEX.ht={};
  const mk=(name,col,step,r)=>{const s=makeCanvas(step,step),sc=s.getContext('2d');sc.fillStyle=col;sc.beginPath();sc.arc(step/2,step/2,r,0,6.28);sc.fill();sc.beginPath();sc.arc(0,0,r,0,6.28);sc.arc(step,0,r,0,6.28);sc.arc(0,step,r,0,6.28);sc.arc(step,step,r,0,6.28);sc.fill();TEX.ht[name]=ctx.createPattern(s,'repeat')};
  mk('navy',C.navy,14,3.2);mk('pink',C.pink,12,3.4);mk('yellow',C.yellow,13,4);mk('orange',C.orange,12,3.2);mk('navyFine',C.navyD,10,2.0);mk('teal',C.teal,13,4.2);
}

// ---------- primitives ----------
function inkFill(path,col,dx=5,dy=3){ctx.save();ctx.translate(dx,dy);ctx.globalCompositeOperation='multiply';ctx.fillStyle=col;ctx.fill(path);ctx.restore()}
function solidFill(path,col,dx=5,dy=3){ctx.save();ctx.translate(dx,dy);ctx.fillStyle=col;ctx.fill(path);ctx.restore()}
function inkLine(path,w=7,col=C.line){ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke(path);ctx.restore()}
function htFill(path,pat,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation='multiply';ctx.fillStyle=TEX.ht[pat]||TEX.ht.navy;ctx.fill(path);ctx.restore()}
function wobblyCircle(cx,cy,r,seed,amp=0.025,n=40){const p=new Path2D();const R=mulberry(seed);const ph=[R()*6,R()*6,R()*6];
  for(let i=0;i<=n;i++){const a=i/n*6.2832;const rr=r*(1+amp*Math.sin(a*3+ph[0])+amp*0.6*Math.sin(a*5+ph[1])+amp*0.4*Math.sin(a*7+ph[2]));const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath();return p}
function blob(cx,cy,rx,ry,rot,seed,amp=0.12){const p=new Path2D();const R=mulberry(seed);const ph=[R()*6,R()*6];
  for(let i=0;i<=48;i++){const a=i/48*6.2832;const k=1+amp*Math.sin(a*2+ph[0])+amp*0.7*Math.sin(a*3+ph[1]);const x0=Math.cos(a)*rx*k,y0=Math.sin(a)*ry*k;const x=cx+x0*Math.cos(rot)-y0*Math.sin(rot),y=cy+x0*Math.sin(rot)+y0*Math.cos(rot);i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath();return p}
function boilT(t){const s=boilSeed(t);return[(hash(s)-0.5)*2.4,(hash(s+99)-0.5)*2.4]}
function paperLabel(x,y,w,h,rot,fill=C.paperHi,shadow=0.28){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=`rgba(32,40,90,${shadow})`;ctx.fillRect(-w/2+9,-h/2+10,w,h);ctx.fillStyle=fill;ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='rgba(38,48,106,0.25)';ctx.lineWidth=2;ctx.strokeRect(-w/2,-h/2,w,h);ctx.restore()}
function tape(x,y,w,h,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='rgba(32,40,90,0.25)';ctx.fillRect(-w/2+7,-h/2+8,w,h);ctx.fillStyle=col;ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-w*0.18,-h*0.22);ctx.lineTo(-w*0.05,h*0.22);ctx.moveTo(w*0.02,-h*0.22);ctx.lineTo(w*0.12,h*0.18);ctx.stroke();ctx.restore()}
function fitFont(txt,weight,size,maxW,family='Rubik'){ctx.font=`${weight} ${size}px ${family}`;const w=ctx.measureText(txt).width;return w>maxW?size*maxW/w:size}
function slamText(txt,x,y,size,col,appear,t,rot=0,onDark=false,maxW=900){
  if(t<appear)return;const u=t-appear;const k=u<0.1?lerp(1.28,1,twos(u)/0.1):1;
  size=fitFont(txt,900,size,maxW);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(k,k);ctx.font=`900 ${size}px Rubik`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
  if(onDark){ctx.fillStyle='rgba(18,24,64,0.55)';ctx.fillText(txt,14,12)}
  ctx.globalCompositeOperation=onDark?'source-over':'multiply';ctx.fillStyle=col;ctx.fillText(txt,7,5);
  ctx.globalCompositeOperation='source-over';ctx.lineJoin='round';ctx.strokeStyle=onDark?C.navyD:C.line;ctx.lineWidth=Math.max(4,size*0.022);ctx.strokeText(txt,0,0);ctx.restore()}
function tagLabel(x,y,title,sub,u,rot=-0.03,w=null){const k=back(u/0.25);if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(k,k);
  ctx.font='800 50px Rubik';const tw=Math.max(ctx.measureText(title).width+70,sub?sub.length*15+60:0,200);const ww=w||Math.min(tw,960);
  paperLabel(0,0,ww,sub?112:84,rot);ctx.rotate(rot);ctx.fillStyle=C.ink;const fs=fitFont(title,800,50,ww-40);ctx.font=`800 ${fs}px Rubik`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(title,0,sub?-12:2);
  if(sub){ctx.fillStyle=C.pink;ctx.font='700 22px "Space Mono"';ctx.direction='ltr';ctx.fillText(sub,0,31)}ctx.restore()}
function sunburst(t,t0,col,cx,cy,alpha=0.85){if(t<t0)return;const u=easeOut((t-t0)/0.25);ctx.save();ctx.translate(cx,cy);ctx.rotate((t-t0)*0.12);ctx.globalCompositeOperation='multiply';ctx.fillStyle=col;ctx.globalAlpha=alpha;const n=18,R=1600*u;
  for(let i=0;i<n;i++){const a=i/n*6.2832;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-0.085)*R,Math.sin(a-0.085)*R);ctx.lineTo(Math.cos(a+0.085)*R,Math.sin(a+0.085)*R);ctx.closePath();ctx.fill()}ctx.restore()}
function confetti(t,t0,seed,cols,cx=540,cy=420){if(t<t0||t>t0+2.2)return;const R=mulberry(seed);for(let i=0;i<14;i++){const a=R()*6.28,sp=300+R()*500,x0=cx+Math.cos(a)*60,y0=cy+Math.sin(a)*40;const u=twos(t-t0);const d=sp*(1-Math.exp(-u*5));const x=x0+Math.cos(a)*d,y=y0+Math.sin(a)*d*0.8+u*u*120;const rot=R()*3+u*(R()-0.5)*4;tape(x,y,58+R()*30,30+R()*10,rot,cols[i%cols.length])}}
function stars(t){const R=mulberry(51);ctx.save();ctx.fillStyle=C.paperHi;for(let i=0;i<40;i++){const x=R()*W,y=R()*1500,r=R()*2.4+1;const tw=0.5+0.5*Math.sin(t*3+i);ctx.globalAlpha=0.35+0.5*tw*(hash(boilSeed(t)+i)>0.2?1:0.4);ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill()}ctx.restore()}
function shakeOf(t,times,amp=24,dur=0.18){let sx=0,sy=0;times.forEach(t0=>{const u=t-t0;if(u>=0&&u<dur){const f=boilSeed(t*3);sx+=(hash(f)-0.5)*amp*(1-u/dur);sy+=(hash(f+5)-0.5)*amp*(1-u/dur)}});return[sx,sy]}

// backgrounds: paper | navy | pink | yellow | teal (tinted paper)
function background(b,t){const bg=b.bg||'paper';
  if(bg==='navy'){ctx.drawImage(TEX.navy,0,0);stars(t);return true}
  ctx.drawImage(TEX.paper,0,0);
  if(bg==='pink'||bg==='yellow'||bg==='teal'){const d=new Path2D();d.arc(540,980,640,0,6.28);htFill(d,bg,0.75)}
  return false}

// ---------- icon library (drawn centred at 0,0, ~size 200) ----------
const ICONS={
  heart:()=>new Path2D('M 0 80 C -140 -20 -120 -140 -40 -140 C 0 -140 0 -100 0 -80 C 0 -100 0 -140 40 -140 C 120 -140 140 -20 0 80 Z'),
  drop:()=>new Path2D('M 0 -140 C 40 -80 100 -20 100 40 C 100 100 55 140 0 140 C -55 140 -100 100 -100 40 C -100 -20 -40 -80 0 -140 Z'),
  flame:()=>new Path2D('M 0 -150 C 30 -90 110 -50 100 40 C 92 110 45 145 0 145 C -55 145 -100 105 -100 45 C -100 -10 -60 -40 -40 -90 C -25 -50 -10 -40 0 -30 C 10 -70 -5 -110 0 -150 Z'),
  leaf:()=>new Path2D('M -120 120 C -120 -20 -20 -130 130 -130 C 130 20 30 120 -120 120 Z M -120 120 L 60 -60'),
  moon:()=>new Path2D('M 40 -140 A 140 140 0 1 0 140 40 A 110 110 0 1 1 40 -140 Z'),
  eye:()=>new Path2D('M -150 0 C -90 -90 90 -90 150 0 C 90 90 -90 90 -150 0 Z'),
  bell:()=>new Path2D('M -100 90 C -100 0 -90 -110 0 -120 C 90 -110 100 0 100 90 L 130 110 L -130 110 Z'),
  lungs:()=>new Path2D('M -10 -150 L 10 -150 L 10 -70 L -10 -70 Z M -35 -55 C -70 -110 -150 -70 -150 30 C -150 115 -100 145 -55 128 C -32 118 -30 70 -35 -55 Z M 35 -55 C 70 -110 150 -70 150 30 C 150 115 100 145 55 128 C 32 118 30 70 35 -55 Z'),
  brain:()=>new Path2D('M -10 -120 C -70 -140 -130 -90 -130 -30 C -160 10 -140 80 -90 100 C -70 140 -20 140 -10 110 Z M 10 -120 C 70 -140 130 -90 130 -30 C 160 10 140 80 90 100 C 70 140 20 140 10 110 Z'),
  sun:()=>{const p=new Path2D();p.arc(0,0,85,0,6.28);for(let i=0;i<12;i++){const a=i/12*6.283;p.moveTo(Math.cos(a)*110,Math.sin(a)*110);p.lineTo(Math.cos(a+0.13)*150,Math.sin(a+0.13)*150);p.lineTo(Math.cos(a-0.13)*150,Math.sin(a-0.13)*150);p.closePath()}return p},
  star:()=>{const p=new Path2D();for(let i=0;i<10;i++){const a=i/10*6.283-1.57,r=i%2?60:145;i?p.lineTo(Math.cos(a)*r,Math.sin(a)*r):p.moveTo(Math.cos(a)*r,Math.sin(a)*r)}p.closePath();return p},
  lotus:()=>new Path2D('M 0 100 C -30 40 -30 -60 0 -130 C 30 -60 30 40 0 100 Z M 0 100 C -60 80 -120 10 -110 -70 C -60 -40 -20 20 0 100 Z M 0 100 C 60 80 120 10 110 -70 C 60 -40 20 20 0 100 Z M -150 100 C -100 70 100 70 150 100 C 100 120 -100 120 -150 100 Z'),
  check:()=>new Path2D('M -110 0 L -40 70 L 120 -90 L 90 -120 L -40 10 L -80 -30 Z'),
  cross:()=>new Path2D('M -100 -70 L -70 -100 L 0 -30 L 70 -100 L 100 -70 L 30 0 L 100 70 L 70 100 L 0 30 L -70 100 L -100 70 L -30 0 Z'),
  clock:()=>{const p=new Path2D();p.arc(0,0,140,0,6.28);p.moveTo(0,0);p.lineTo(0,-95);p.moveTo(0,0);p.lineTo(70,30);return p},
  battery:()=>new Path2D('M -80 -120 L 80 -120 L 80 140 L -80 140 Z M -30 -150 L 30 -150 L 30 -120 L -30 -120 Z'),
  wave:()=>{const p=new Path2D();for(let i=0;i<=40;i++){const x=-150+i*7.5,y=Math.sin(i/40*Math.PI*4)*60;i?p.lineTo(x,y):p.moveTo(x,y)}return p},
  spiral:()=>{const p=new Path2D();for(let i=0;i<=120;i++){const a=i/120*Math.PI*6,r=8+i*1.1;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?p.lineTo(x,y):p.moveTo(x,y)}return p},
};
const STROKE_ONLY=new Set(['wave','spiral','clock','leaf']);
let SOLID=false;
function drawIcon(name,x,y,s,col,rot=0,t=0){const f=ICONS[name]||ICONS.star;const fill=SOLID?solidFill:inkFill;const p=f();ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  if(STROKE_ONLY.has(name)){if(name==='clock'||name==='leaf'){fill(p,col,5,4)}ctx.save();ctx.lineWidth=14/s;inkLine(p,Math.max(9,9/s),C.line);ctx.restore()}
  else{fill(p,col,7,5);if(name==='heart'||name==='drop'||name==='moon'||name==='flame'){const hl=new Path2D();hl.arc(-40,-60,40,3.6,4.6);inkLine(hl,12,C.paperHi)}inkLine(p,Math.max(8,8/s),C.line);
    if(name==='eye'){const ir=new Path2D();ir.arc(0,0,48,0,6.28);fill(ir,C.navy,0,0);inkLine(ir,8);const pu=new Path2D();pu.arc(-14,-14,12,0,6.28);ctx.fillStyle=C.paperHi;ctx.fill(pu)}}
  ctx.restore()}
function molecule(x,y,s,rot,atoms){atoms=atoms||[['N',C.yellow],['O',C.pink]];ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.strokeStyle=C.line;ctx.lineWidth=4;
  const n=atoms.length;const xs=atoms.map((_,i)=>(i-(n-1)/2)*32);ctx.beginPath();ctx.moveTo(xs[0],0);ctx.lineTo(xs[n-1],0);ctx.stroke();
  atoms.forEach(([l,c],i)=>{const r=i===0?20:15;ctx.fillStyle=COL(c);ctx.beginPath();ctx.arc(xs[i],0,r,0,6.28);ctx.fill();ctx.stroke();ctx.fillStyle=C.ink;ctx.font='700 20px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,xs[i],1)});ctx.restore()}
// a small particle: molecule or icon or dot
function particle(kind,x,y,s,rot){if(Array.isArray(kind)){molecule(x,y,s,rot,kind.map((a,i)=>[a,[C.yellow,C.pink,C.teal,C.orange][i%4]]));return}
  if(kind==='dot'||!kind){ctx.save();ctx.fillStyle=C.yellow;ctx.strokeStyle=C.line;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,14*s,0,6.28);ctx.fill();ctx.stroke();ctx.restore();return}
  drawIcon(kind,x,y,0.16*s,C.yellow,rot)}

// ---------- the figure (original character) ----------
function figure(t,opt={}){
  const [bx,by]=boilT(t);const hx=540,hy=860,hr=172;const hum=opt.hum?1:0;const vib=hum?Math.sin(t*2*Math.PI*21)*1.6:0;const mood=opt.mood||'calm';
  ctx.save();ctx.translate(bx+vib*0.4,by);
  const body=new Path2D('M 230 1920 L 236 1270 C 240 1140 360 1085 470 1072 L 610 1072 C 720 1085 840 1140 844 1270 L 850 1920 Z');
  inkFill(body,COL(opt.body||'orange'),6,4);
  htFill(new Path2D('M 236 1270 C 240 1140 360 1085 430 1078 C 380 1160 360 1300 352 1920 L 230 1920 Z'),'navy',0.9);inkLine(body,7);
  const collar=new Path2D('M 452 1074 C 470 1120 610 1120 628 1074 L 616 1030 L 464 1030 Z');inkFill(collar,C.navy,4,3);inkLine(collar,6);
  const neck=new Path2D('M 494 990 L 492 1062 C 520 1078 560 1078 588 1062 L 586 990 Z');ctx.fillStyle=C.paperHi;ctx.fill(neck);htFill(neck,'pink',0.5);inkLine(neck,6);
  ctx.save();ctx.translate(vib,0);
  const head=wobblyCircle(hx,hy,hr,11,0.012);
  [[hx-hr+6],[hx+hr-6]].forEach(([ex])=>{const e=new Path2D();e.ellipse(ex,hy+18,26,40,0,0,6.28);ctx.fillStyle=C.paperHi;ctx.fill(e);htFill(e,'pink',0.6);inkLine(e,6)});
  ctx.fillStyle=C.paperHi;ctx.fill(head);inkLine(head,7);

  const k=back(u/0.3);ctx.save();ctx.translate(540,990);ctx.rotate(Math.sin(u*1.6)*0.06-0.04);ctx.scale(k,k);
  if(b.atoms){const n=b.atoms.length;const R=[190,145,130,120];let x=-(n-1)*150;b.atoms.forEach((a,i)=>{const p=new Path2D();p.arc(x,0,R[i]||120,0,6.28);(dark?solidFill:inkFill)(p,[C.yellow,C.pink,C.teal,C.orange][i%4],9,6);inkLine(p,9);ctx.fillStyle=C.ink;ctx.font=`700 ${i?130:170}px "Space Mono"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(a,x,8);x+=(R[i]||120)+(R[i+1]||120)-40});}
  else{const pulse=1+0.04*Math.sin(u*6);SOLID=dark;drawIcon(b.icon||'star',0,0,1.9*pulse,COL(b.color||'yellow'),0,t);SOLID=false}
  ctx.restore();
  if(b.label){const lu=back((u-0.15)/0.25);if(lu>0){ctx.save();ctx.translate(540,1290);ctx.scale(lu,lu);ctx.font='700 34px "Space Mono"';const lw=ctx.measureText(b.label).width+80;paperLabel(0,0,Math.max(300,lw),84,0.02);ctx.rotate(0.02);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=/[֐-׿]/.test(b.label)?'rtl':'ltr';ctx.font=/[֐-׿]/.test(b.label)?'800 40px Rubik':'700 34px "Space Mono"';ctx.fillText(b.label,0,2);ctx.restore()}}
  ctx.restore();overlays(b,t,dark)};

// word: big kinetic words, each slams at its own time; tapes + optional sunburst
BEATS.word=function(b,t){const dark=background(b,t);ctx.save();const words=b.words||[];const times=words.map((w,i)=>w.at??(b.t0+i*0.35));cam(t,b,540,H/2,1.02,1.08,[b.t0,...times]);

  ctx.restore();overlays(b,t,dark,true)};

// cards: 2-4 paper cards, each with icon + text, appear one after another
BEATS.cards=function(b,t){const dark=background(b,t);ctx.save();const items=b.items||[];const times=items.map((it,i)=>it.at??(b.t0+0.1+i*0.45));cam(t,b,540,H/2,1,1.04,[b.t0]);
  const n=items.length;const ch=230,gap=50;const y0=980-((n-1)*(ch+gap))/2;
  items.forEach((it,i)=>{const u=t-times[i];if(u<0)return;const k=back(u/0.25);const y=y0+i*(ch+gap);const x=540+(i%2?30:-30);const rot=(i%2?0.025:-0.025);
    ctx.save();ctx.translate(lerp(i%2?1400:-400,x,easeOut(u/0.25)),y);ctx.rotate(rot);ctx.scale(k,1);
    ctx.fillStyle='rgba(32,40,90,0.3)';ctx.fillRect(-430+12,-ch/2+14,860,ch);ctx.fillStyle=C.paperHi;ctx.fillRect(-430,-ch/2,860,ch);ctx.strokeStyle=C.line;ctx.lineWidth=6;ctx.strokeRect(-430,-ch/2,860,ch);
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=[C.yellow,C.pink,C.teal,C.orange][i%4];ctx.fillRect(250,-ch/2+3,177,ch-6);ctx.restore();
    drawIcon(it.icon||'check',338,0,0.55,[C.orange,C.yellow,C.paperHi,C.pink][i%4],0,t);
    ctx.fillStyle=C.ink;const fs=fitFont(it.text,800,64,600);ctx.font=`800 ${fs}px Rubik`;ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(it.text,220,it.sub?-18:4);
    if(it.sub){ctx.fillStyle=C.pink;ctx.font='700 26px "Space Mono"';ctx.direction='ltr';ctx.textAlign='right';ctx.fillText(it.sub,220,48)}
    ctx.restore()});
  ctx.restore();overlays(b,t,dark)};

// wave: sine wave(s) across the screen; params: color, freq (cycles), label, code, calm_at (wave smooths)
BEATS.wave=function(b,t){const dark=background(b,t);ctx.save();cam(t,b,540,H/2,1,1.05);const u=t-b.t0;const calm=b.calm_at!=null?ss((t-b.calm_at)/0.6):0;
  const lines=b.lines||[{color:b.color||'yellow'}];lines.forEach((ln,j)=>{const amp=lerp(ln.amp??160,ln.amp_to??(ln.amp??160),calm);const fq=lerp(ln.freq??3,ln.freq_to??(ln.freq??3),calm);const noise=lerp(ln.noise??0,0,calm);
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=COL(ln.color||'yellow');ctx.lineWidth=16;ctx.globalCompositeOperation=dark?'source-over':'multiply';ctx.beginPath();
    const y0=980+(j-(lines.length-1)/2)*260;const reveal=clamp(u/0.5);for(let i=0;i<=200*reveal;i++){const v=i/200;const x=40+v*1000;const R=hash(i*7+boilSeed(t));const y=y0+Math.sin(v*Math.PI*2*fq-t*5+j)*amp+(R-0.5)*noise*amp;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore();
    if(ln.label){tagLabel(ln.x||(j%2?780:300),y0-amp-90,ln.label,ln.sub,u-0.2-j*0.2)}});
  ctx.restore();overlays(b,t,dark)};

// breath: circle that expands/contracts with labels (inhale/exhale), counter
BEATS.breath=function(b,t){const dark=background(b,t);ctx.save();cam(t,b,540,H/2,1,1.04);const u=t-b.t0;const period=b.period||2.4;const ph=(u%period)/period;const r=lerp(180,420,ph<0.5?ss(ph*2):ss((1-ph)*2));
  for(let k=3;k>=0;k--){const p=new Path2D();p.arc(540,980,r+k*50,0,6.28);ctx.save();ctx.globalAlpha=0.25+0.18*(3-k);if(dark){ctx.fillStyle=k%2?C.teal:C.yellow;ctx.fill(p)}else htFill(p,k%2?'teal':'yellow',1);ctx.restore()}
  const core=new Path2D();core.arc(540,980,r,0,6.28);solidFill(core,ph<0.5?C.yellow:C.pink,6,4);inkLine(core,9);
  const lbl=ph<0.5?(b.in_label||'שאיפה'):(b.out_label||'נשיפה');ctx.fillStyle=C.ink;ctx.font=`900 ${fitFont(lbl,900,110,r*1.6)}px Rubik`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,540,980);
  ctx.restore();overlays(b,t,dark)};

// versus: split top/bottom, two states
BEATS.versus=function(b,t){ctx.drawImage(TEX.paper,0,0);const u=t-b.t0;const [sx,sy]=shakeOf(t,[b.t0,b.b_at??b.t0+0.6],22);ctx.save();ctx.translate(sx,sy);
  const A=b.a||{},B=b.b||{};const tb=b.b_at??(b.t0+(b.t1-b.t0)*0.45);
  const top=new Path2D();top.rect(0,0,W,940);ctx.save();ctx.clip(top);ctx.drawImage(TEX.navy,0,0);ctx.restore();
  const ka=back(u/0.3);SOLID=true;drawIcon(A.icon||'cross',540,500,1.2*ka,COL(A.color||'pink'),Math.sin(u*2)*0.05,t);SOLID=false;
  if(A.label)tagLabel(540,790,A.label,A.sub,u-0.1);
  if(t>=tb){const kb=back((t-tb)/0.3);const bot=new Path2D();bot.arc(540,1400,1100*easeOut((t-tb)/0.35),0,6.28);ctx.save();ctx.clip(new Path2D('M 0 940 L 1080 940 L 1080 1920 L 0 1920 Z'));htFill(bot,B.tint||'yellow',0.6);ctx.restore();
    drawIcon(B.icon||'check',540,1110,1.0*kb,COL(B.color||'teal'),0,t);if(B.label)tagLabel(540,1310,B.label,B.sub,t-tb-0.1)}
  tape(540,940,1200,46,-0.02,C.yellow);
  ctx.restore();overlays(b,t,true)};

// chart: bars climbing; highlight one
BEATS.chart=function(b,t){const dark=background(b,t);ctx.save();cam(t,b,540,H/2,1,1.04);const u=t-b.t0;const bars=b.bars||[];const n=bars.length;const max=Math.max(...bars.map(x=>x.value),1);
  const bw=Math.min(200,820/n-40);const gx=540-(n*(bw+40)-40)/2;const base=1300,hmax=640;
  ctx.save();ctx.strokeStyle=dark?C.paperHi:C.line;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(100,base);ctx.lineTo(980,base);ctx.stroke();ctx.restore();
  bars.forEach((x,i)=>{const st=(x.at??(b.t0+0.15+i*0.25));const g=easeOut((t-st)/0.5);if(g<=0)return;const h=hmax*x.value/max*g;const bx=W-(gx+i*(bw+40))-bw;
    const p=new Path2D();p.rect(bx,base-h,bw,h);(dark?solidFill:inkFill)(p,x.hi?C.pink:C.orange,6,4);if(!x.hi)htFill(p,'navyFine',0.25);inkLine(p,6,dark?C.navyD:C.line);
    ctx.fillStyle=dark?C.paperHi:C.ink;ctx.font=`700 ${fitFont(String(x.show??x.value),700,64,bw+30,'"Space Mono"')}px "Space Mono"`;ctx.textAlign='center';ctx.direction='ltr';ctx.fillText(String(x.show??x.value),bx+bw/2,base-h-40);
    ctx.font=`800 ${fitFont(x.label,800,42,bw+40)}px Rubik`;ctx.direction='rtl';ctx.fillText(x.label,bx+bw/2,base+60)});
  ctx.restore();overlays(b,t,dark)};

// ---------- per-beat overlays: slam, tag ----------
function overlays(b,t,dark,skipSlam){
  if(b.tag)tagLabel(b.tag.x||300,b.tag.y||330,b.tag.title,b.tag.sub,t-(b.tag.at??b.t0)-0.1);
  if(b.slam&&!skipSlam){const s=b.slam;const y=s.y||(b.type==='figure'&&b.framing==='face'?340:380);
    if(s.text2&&t>=(s.at2??1e9))slamText(s.text2,540,y,s.size||250,COL(s.color||(dark?'yellow':'orange')),s.at2,t,-0.03,dark||s.dark);
    else slamText(s.text,540,y,s.size||250,COL(s.color||(dark?'yellow':'pink')),s.at??b.t0,t,-0.03,dark||s.dark)}}

// ---------- global overlays ----------
function liveLabel(t){const L=DATA.live||{};const x=880,y=190,w=300,h=104;paperLabel(x,y,w,h,0.01,C.paperHi,0.22);ctx.save();ctx.translate(x,y);ctx.rotate(0.01);
  ctx.fillStyle=C.pink;ctx.beginPath();ctx.arc(-w/2+24,-h/2+26,7,0,6.28);ctx.fill();ctx.font='700 20px "Space Mono"';ctx.textAlign='left';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText('LIVE',-w/2+38,-h/2+27);
  const sec=Math.floor(t),fr=Math.floor((t%1)*30);ctx.fillStyle=C.grey;ctx.fillText(`00:${String(sec).padStart(2,'0')}:${String(fr).padStart(2,'0')}`,w/2-140,-h/2+27);
  let txt=L.text||'';if(L.from!=null){let v=L.from;if(t>=L.start_at)v=lerp(L.from,L.to,Math.pow(clamp(twos(t-L.start_at)/Math.max(0.2,L.end_at-L.start_at)),1.4));txt=(L.label||'')+' '+(L.prefix??'×')+v.toFixed(L.decimals??1).padStart(4,'0')}
  ctx.fillStyle=C.ink;ctx.font=`400 ${fitFont(txt,400,40,w-40,'"Space Mono"')}px "Space Mono"`;ctx.fillText(txt,-w/2+20,h/2-30);ctx.restore()}
const KW=new Set((DATA.keywords||[]).map(s=>s.replace(/[,.?!:;"״׳]/g,'')));
function caption(t){const ch=DATA.chunks.find(c=>t>=c.t0&&t<c.t1);if(!ch)return;
  ctx.save();let fs=62;ctx.font=`700 ${fs}px Rubik`;ctx.direction='rtl';ctx.textBaseline='middle';let sp=ctx.measureText(' ').width;let ws=ch.w.map(s=>ctx.measureText(s).width);let tw=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  if(tw>900){fs=fs*900/tw;ctx.font=`700 ${fs}px Rubik`;sp=ctx.measureText(' ').width;ws=ch.w.map(s=>ctx.measureText(s).width);tw=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1)}
  const bw=tw+64,bh=104,cx=540,cy=1452;const k=t-ch.t0<0.07?0.94:1;ctx.translate(cx,cy);ctx.rotate(-0.012);ctx.scale(k,k);paperLabel(0,0,bw,bh,0,'#f5efe0',0.32);let x=tw/2;
  ch.w.forEach((s,i)=>{const said=t>=ch.ws[i];const kw=KW.has(s.replace(/[,.?!:;"״׳]/g,''));ctx.textAlign='right';ctx.fillStyle=said?C.ink:'rgba(40,46,90,0.32)';ctx.fillText(s,x,2);
    if(said&&kw){const u=clamp((t-ch.ws[i])/0.12);ctx.save();ctx.globalCompositeOperation='multiply';ctx.strokeStyle=C.pink;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,34);ctx.lineTo(x-ws[i]*u,36);ctx.stroke();ctx.restore()}x-=ws[i]+sp});ctx.restore()}
function finish(t){ctx.save();ctx.globalCompositeOperation='lighten';ctx.globalAlpha=0.55;ctx.drawImage(TEX.wear,0,0);ctx.restore();
  const s=boilSeed(t*1.5);const ox=Math.floor(hash(s)*200),oy=Math.floor(hash(s+3)*200);ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.16;ctx.drawImage(TEX.grain,-ox,-oy,W+400,H+400);ctx.restore()}

function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const b=DATA.beats.find(x=>t>=x.t0&&t<x.t1)||DATA.beats[DATA.beats.length-1];
  (BEATS[b.type]||BEATS.hero)(b,t);liveLabel(t);caption(t);finish(t)}
window.render=render;
window.ready=(async()=>{await Promise.all(['500 60px Rubik','700 60px Rubik','800 60px Rubik','900 60px Rubik','700 20px "Space Mono"','400 20px "Space Mono"'].map(f=>document.fonts.load(f,'אב 15 ×AZ')));await document.fonts.ready;buildTextures();render(0);return true})();
